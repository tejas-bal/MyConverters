<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #161616;
      --ink:      #1f1f1f;
      --gray-700: #595959;
      --gray-500: #8c8c8c;
      --gray-300: #d6d6d6;
      --gray-200: #e6e6e6;
      --gray-100: #f3f3f3;
      --white:    #ffffff;
      --border:   #dcdcdc;
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
    }

    body {
      font-family: 'Google Sans Text', 'Google Sans', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background-color: #eaeaea;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px 20px;
    }

    .card {
      background: var(--white);
      border-radius: 18px;
      padding: 24px 26px;
      width: 100%;
      max-width: 460px;
      margin-top: 8px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      color: var(--ink);
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      font-family: 'Google Sans', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.3px;
    }

    .header p {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 3px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 11px;
      color: var(--gray-700);
      margin-bottom: 16px;
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: 20px;
      padding: 5px 12px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--black);
      flex-shrink: 0;
    }

    .status-dot.loading {
      background: var(--gray-300);
    }
    .status-dot.error {
      background: transparent;
      border: 1.5px solid var(--black);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--gray-700);
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--gray-100);
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      appearance: auto;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--black);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(22,22,22,0.08);
    }

    input[type="number"]::placeholder { color: var(--gray-500); }
    select option { background: #fff; color: var(--ink); }

    .currency-tabs {
      display: flex;
      gap: 6px;
    }

    .currency-tab {
      flex: 1;
      padding: 9px 0;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--gray-100);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .currency-tab:hover:not(.active) { border-color: var(--black); }

    .currency-tab.active {
      background: var(--black);
      color: #fff;
      border-color: var(--black);
    }

    .result-box {
      margin-top: 16px;
      padding: 16px 8px;
      border-radius: 16px;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      text-align: center;
      display: none;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
    }

    .result-box.visible { display: flex; }

    .rate-info {
      margin-top: 6px;
      font-size: 10px;
      color: var(--gray-500);
      font-style: italic;
    }

    .error-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--gray-100);
      border-left: 3px solid var(--black);
      color: var(--ink);
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .result-divider {
      width: 1px;
      align-self: stretch;
      background: var(--gray-300);
    }

    .result-row {
      flex: 1;
      min-width: 0;
    }

    .timestamp {
      text-align: center;
      font-size: 10px;
      color: var(--gray-500);
      margin-top: 12px;
    }

    .card { position: relative; z-index: 1; }

    /* Symbol badge next to select */
    .select-wrap {
      position: relative;
    }
    .sym-badge {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      font-weight: 700;
      color: var(--black);
      pointer-events: none;
      width: 26px;
      text-align: center;
      line-height: 1;
    }
    .select-wrap select,
    .select-wrap input {
      padding-left: 44px;
    }

    .result-sym {
      font-size: 19px;
      font-weight: 800;
      color: var(--black);
      line-height: 1;
      margin-bottom: 2px;
      display: block;
    }
    .result-amount {
      font-family: 'Google Sans', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.3px;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Currency Converter</h1>
    <p>Real-time exchange rates</p>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Fetching live rates…</span>
  </div>

  <!-- Base currency switcher -->
  <div class="field-group">
    <label>Convert From</label>
    <div class="currency-tabs" id="currencyTabs"></div>
  </div>

  <!-- Amount Input -->
  <div class="field-group">
    <label id="amountLabel">Amount (GBP)</label>
    <div class="select-wrap">
      <span class="sym-badge" id="amountSymBadge">£</span>
      <input type="number" id="amount" placeholder="Enter amount" value="1" min="0" step="any" />
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="result-box" id="resultBox">
    <div class="result-row" id="resultSlot0">
      <span class="result-sym" id="resultSym0"></span>
      <div class="result-amount" id="resultAmount0">—</div>
      <div class="rate-info" id="rateInfo0"></div>
    </div>
    <div class="result-divider"></div>
    <div class="result-row" id="resultSlot1">
      <span class="result-sym" id="resultSym1"></span>
      <div class="result-amount" id="resultAmount1">—</div>
      <div class="rate-info" id="rateInfo1"></div>
    </div>
    <div class="result-divider"></div>
    <div class="result-row" id="resultSlot2">
      <span class="result-sym" id="resultSym2"></span>
      <div class="result-amount" id="resultAmount2">—</div>
      <div class="rate-info" id="rateInfo2"></div>
    </div>
  </div>

  <div class="timestamp" id="timestamp"></div>
</div>

<script>
  const SYMBOLS = {
    USD:"$", EUR:"€", GBP:"£", JPY:"¥", CAD:"CA$", AUD:"A$", CHF:"Fr",
    CNY:"¥", INR:"₹", MXN:"MX$", BRL:"R$", KRW:"₩", SGD:"S$", HKD:"HK$",
    NOK:"kr", SEK:"kr", DKK:"kr", NZD:"NZ$", ZAR:"R", AED:"د.إ", SAR:"﷼",
    THB:"฿", MYR:"RM", IDR:"Rp", PHP:"₱", PLN:"zł", CZK:"Kč", HUF:"Ft",
    TRY:"₺", RUB:"₽", EGP:"E£", PKR:"₨", BDT:"৳", VND:"₫", NGN:"₦",
    KES:"KSh", GHS:"₵", CLP:"CL$", COP:"CO$", PEN:"S/", ILS:"₪",
    QAR:"﷼", KWD:"KD", BHD:"BD", OMR:"﷼", RON:"lei", UAH:"₴"
  };

  let rates = {};
  let ratesBase = "USD";
  let ratesTimestamp = null;

  const CURRENCIES = ['GBP', 'USD', 'INR', 'EUR'];
  let baseCurrency = 'GBP';

  let ratesLoaded = false;

  const amountEl = document.getElementById('amount');
  const amountLabel = document.getElementById('amountLabel');
  const amountSymBadge = document.getElementById('amountSymBadge');
  const currencyTabs = document.getElementById('currencyTabs');
  const resultBox  = document.getElementById('resultBox');
  const errorMsg     = document.getElementById('errorMsg');
  const statusDot    = document.getElementById('statusDot');
  const statusText   = document.getElementById('statusText');
  const timestampEl  = document.getElementById('timestamp');

  // Build base-currency tabs
  CURRENCIES.forEach(code => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'currency-tab' + (code === baseCurrency ? ' active' : '');
    btn.textContent = code;
    btn.dataset.code = code;
    btn.addEventListener('click', () => {
      baseCurrency = code;
      currencyTabs.querySelectorAll('.currency-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.code === code);
      });
      amountLabel.textContent = `Amount (${code})`;
      amountSymBadge.textContent = SYMBOLS[code] || code;
      if (ratesLoaded) doConvert();
    });
    currencyTabs.appendChild(btn);
  });

  // Fetch rates
  async function fetchRates() {
    statusDot.className = 'status-dot loading';
    statusText.textContent = 'Fetching live rates…';
    try {
      const res = await fetch('https://v6.exchangerate-api.com/v6/88d001c76c2c043418662e64/latest/USD');
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      if (data.result !== 'success') throw new Error('API error');
      rates = data.conversion_rates;
      ratesBase = data.base_code;
      ratesTimestamp = data.time_last_update_utc;
      statusDot.className = 'status-dot';
      statusText.textContent = 'Live rates loaded';
      ratesLoaded = true;
      const d = new Date(ratesTimestamp);
      timestampEl.textContent = `Rates updated: ${d.toUTCString()}`;
      // Auto-convert
      doConvert();
    } catch (e) {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'Could not load live rates';
      showError('Failed to fetch exchange rates. Please check your internet connection and reload.');
    }
  }

  function showError(msg) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = msg;
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  function doConvert() {
    hideError();
    const amount = parseFloat(amountEl.value);

    if (isNaN(amount) || amount < 0) {
      showError('Please enter a valid positive amount.');
      resultBox.classList.remove('visible');
      return;
    }

    const targetCurrencies = CURRENCIES.filter(c => c !== baseCurrency);

    if (!rates[baseCurrency] || targetCurrencies.some(c => !rates[c])) {
      showError('Exchange rate not available.');
      return;
    }

    const inUSD = amount / rates[baseCurrency];

    targetCurrencies.forEach((to, idx) => {
      const converted = inUSD * rates[to];
      const formatter = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      const symTo = SYMBOLS[to] || to;
      document.getElementById(`resultSym${idx}`).textContent = symTo;
      document.getElementById(`resultAmount${idx}`).textContent = `${symTo}${formatter.format(converted)}`;
      const rate = rates[to] / rates[baseCurrency];
      document.getElementById(`rateInfo${idx}`).textContent = `1 ${baseCurrency} = ${symTo}${rate.toFixed(2)}`;
    });

    resultBox.classList.add('visible');
  }

  // Auto-convert on input change
  amountEl.addEventListener('input', () => { if (ratesLoaded) doConvert(); });

  fetchRates();
</script>
</body>
</html>
