<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #f0e8d5;
      --white:    #ffffff;
      --green-dk: #1e5c34;
      --green-md: #2d7a47;
      --green-lt: #e8f5ec;
      --green-accent: #34a853;
      --earth-tan:  #c8b89a;
      --earth-warm: #7a6652;
      --text-dark:  #1a2e1e;
      --text-mid:   #4a5c4e;
      --text-light: #7a8c7e;
      --border:     #d6cfc4;
      --shadow:     0 4px 24px rgba(30,92,52,0.10);
      --shadow-lg:  0 12px 40px rgba(30,92,52,0.14);
    }

    body {
      font-family: 'Google Sans Text', 'Google Sans', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      background-color: #f7c9dd;
      background-image:
        radial-gradient(ellipse at 10% 20%, rgba(52,168,83,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 80%, rgba(180,150,100,0.10) 0%, transparent 55%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--white);
      border-radius: 22px;
      padding: 22px 24px;
      width: 100%;
      max-width: 460px;
      margin-top: 32px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      color: var(--text-dark);
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .header .icon {
      font-size: 22px;
      margin-bottom: 2px;
      display: block;
    }

    .header h1 {
      font-family: 'Google Sans', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--green-dk);
      letter-spacing: -0.3px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 11px;
      color: var(--text-light);
      margin-bottom: 16px;
      background: var(--green-lt);
      border-radius: 20px;
      padding: 5px 12px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-accent);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    .status-dot.loading {
      background: transparent;
      border: 2px solid var(--earth-tan);
      border-top-color: var(--green-md);
      animation: spin 0.8s linear infinite;
      width: 8px; height: 8px;
    }
    .status-dot.error { background: #e53935; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--earth-warm);
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--cream);
      color: var(--text-dark);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      appearance: auto;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--green-md);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(52,168,83,0.12);
    }

    input[type="number"]::placeholder { color: var(--text-light); }
    select option { background: #fff; color: var(--text-dark); }

    .result-box {
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--green-lt);
      border: 1.5px solid #b6dcc2;
      text-align: center;
      display: none;
    }

    .result-box.visible { display: block; animation: fadeSlideIn 0.35s ease; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rate-info {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-light);
      font-style: italic;
    }

    .error-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #fff3f2;
      border: 1px solid #f5c6c4;
      color: #c0392b;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .result-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .timestamp {
      text-align: center;
      font-size: 10px;
      color: var(--text-light);
      margin-top: 12px;
    }

    /* Floating symbols background */
    .bg-symbols {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-sym {
      position: absolute;
      font-size: 28px;
      opacity: 0.07;
      animation: floatUp linear infinite;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.07; }
      90%  { opacity: 0.07; }
      100% { transform: translateY(-10vh) rotate(25deg); opacity: 0; }
    }

    .card { position: relative; z-index: 1; }

    /* Symbol badge next to select */
    .select-wrap {
      position: relative;
    }
    .sym-badge {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      font-weight: 700;
      color: var(--green-dk);
      pointer-events: none;
      width: 26px;
      text-align: center;
      line-height: 1;
    }
    .select-wrap select,
    .select-wrap input {
      padding-left: 44px;
    }

    /* Fun result bounce */
    @keyframes bounceIn {
      0%   { opacity: 0; transform: scale(0.7) translateY(12px); }
      60%  { transform: scale(1.06) translateY(-3px); }
      80%  { transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .result-box.visible { display: block; animation: bounceIn 0.45s cubic-bezier(.34,1.56,.64,1); }

    .result-sym {
      font-size: 26px;
      font-weight: 800;
      color: var(--green-accent);
      line-height: 1;
      margin-bottom: 2px;
      display: block;
    }
    .result-amount {
      font-family: 'Google Sans', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--green-dk);
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>

<!-- Floating background symbols -->
<div class="bg-symbols" id="bgSymbols"></div>

<div class="card">
  <div class="header">
    <div class="icon">🌍💸</div>
    <h1>Currency Converter</h1>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Fetching live rates…</span>
  </div>

  <!-- Amount Input (GBP) -->
  <div class="field-group">
    <label>Amount (GBP)</label>
    <div class="select-wrap">
      <span class="sym-badge">£</span>
      <input type="number" id="amount" placeholder="Enter amount" value="1" min="0" step="any" />
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="result-box" id="resultBox">
    <div class="result-row" id="resultRowUSD">
      <span class="result-sym">$</span>
      <div class="result-amount" id="resultAmountUSD">—</div>
      <div class="rate-info" id="rateInfoUSD"></div>
    </div>
    <div class="result-divider"></div>
    <div class="result-row" id="resultRowINR">
      <span class="result-sym">₹</span>
      <div class="result-amount" id="resultAmountINR">—</div>
      <div class="rate-info" id="rateInfoINR"></div>
    </div>
  </div>

  <div class="timestamp" id="timestamp"></div>
</div>

<script>
  const SYMBOLS = {
    USD:"$", EUR:"€", GBP:"£", JPY:"¥", CAD:"CA$", AUD:"A$", CHF:"Fr",
    CNY:"¥", INR:"₹", MXN:"MX$", BRL:"R$", KRW:"₩", SGD:"S$", HKD:"HK$",
    NOK:"kr", SEK:"kr", DKK:"kr", NZD:"NZ$", ZAR:"R", AED:"د.إ", SAR:"﷼",
    THB:"฿", MYR:"RM", IDR:"Rp", PHP:"₱", PLN:"zł", CZK:"Kč", HUF:"Ft",
    TRY:"₺", RUB:"₽", EGP:"E£", PKR:"₨", BDT:"৳", VND:"₫", NGN:"₦",
    KES:"KSh", GHS:"₵", CLP:"CL$", COP:"CO$", PEN:"S/", ILS:"₪",
    QAR:"﷼", KWD:"KD", BHD:"BD", OMR:"﷼", RON:"lei", UAH:"₴"
  };

  // Floating background symbols
  const bgSyms = document.getElementById('bgSymbols');
  const allSyms = Object.values(SYMBOLS);
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('div');
    el.className = 'bg-sym';
    el.textContent = allSyms[Math.floor(Math.random() * allSyms.length)];
    el.style.left = (Math.random() * 100) + '%';
    el.style.animationDuration = (14 + Math.random() * 18) + 's';
    el.style.animationDelay = (-Math.random() * 20) + 's';
    el.style.fontSize = (18 + Math.random() * 24) + 'px';
    bgSyms.appendChild(el);
  }

  let rates = {};
  let ratesBase = "USD";
  let ratesTimestamp = null;

  const BASE_CURRENCY = 'GBP';
  const TARGET_CURRENCIES = ['USD', 'INR'];

  let ratesLoaded = false;

  const amountEl = document.getElementById('amount');
  const resultBox  = document.getElementById('resultBox');
  const errorMsg     = document.getElementById('errorMsg');
  const statusDot    = document.getElementById('statusDot');
  const statusText   = document.getElementById('statusText');
  const timestampEl  = document.getElementById('timestamp');

  // Fetch rates
  async function fetchRates() {
    statusDot.className = 'status-dot loading';
    statusText.textContent = 'Fetching live rates…';
    try {
      const res = await fetch('https://v6.exchangerate-api.com/v6/88d001c76c2c043418662e64/latest/USD');
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      if (data.result !== 'success') throw new Error('API error');
      rates = data.conversion_rates;
      ratesBase = data.base_code;
      ratesTimestamp = data.time_last_update_utc;
      statusDot.className = 'status-dot';
      statusText.textContent = 'Live rates loaded';
      ratesLoaded = true;
      const d = new Date(ratesTimestamp);
      timestampEl.textContent = `Rates updated: ${d.toUTCString()}`;
      // Auto-convert
      doConvert();
    } catch (e) {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'Could not load live rates';
      showError('Failed to fetch exchange rates. Please check your internet connection and reload.');
    }
  }

  function showError(msg) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = msg;
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  function doConvert() {
    hideError();
    const amount = parseFloat(amountEl.value);

    if (isNaN(amount) || amount < 0) {
      showError('Please enter a valid positive amount.');
      resultBox.classList.remove('visible');
      return;
    }

    if (!rates[BASE_CURRENCY] || TARGET_CURRENCIES.some(c => !rates[c])) {
      showError('Exchange rate not available.');
      return;
    }

    const inUSD = amount / rates[BASE_CURRENCY];

    TARGET_CURRENCIES.forEach(to => {
      const converted = inUSD * rates[to];
      const formatter = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 4
      });
      const symTo = SYMBOLS[to] || to;
      document.getElementById(`resultAmount${to}`).textContent = `${symTo}${formatter.format(converted)}`;
      const rate = rates[to] / rates[BASE_CURRENCY];
      document.getElementById(`rateInfo${to}`).textContent = `1 ${BASE_CURRENCY} = ${symTo}${rate.toFixed(6)} ${to}`;
    });

    resultBox.classList.remove('visible');
    void resultBox.offsetWidth; // reflow for animation
    resultBox.classList.add('visible');
  }

  // Auto-convert on input change
  amountEl.addEventListener('input', () => { if (ratesLoaded) doConvert(); });

  fetchRates();
</script>
</body>
</html>
